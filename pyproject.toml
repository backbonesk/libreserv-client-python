[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libreserv-client"
dynamic = ["version"]
description = "Python client for libreserv, the LibreOffice document-conversion service"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "BACKBONE, s.r.o." }]
keywords = ["libreoffice", "document", "conversion", "pdf", "docx", "libreserv", "client"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://libreserv.org/"
Documentation = "https://libreserv.org/client.html"
Source = "https://github.com/backbonesk/libreserv-client-python"
Changelog = "https://github.com/backbonesk/libreserv-client-python/blob/master/CHANGELOG.md"
Issues = "https://github.com/backbonesk/libreserv-client-python/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.14",
]

[tool.hatch.version]
path = "src/libreserv_client/_version.py"

# wheels ship only the package; sdists additionally carry tests and docs
# (the usual convention - tests help distro repackagers, never installs)
[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/libreserv_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
